name: Bug 报告
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索已有 Issue，避免重复。
        安全问题请勿在此提交，见 [SECURITY.md](https://github.com/haiying-ai/ai-freebie-radar/blob/main/SECURITY.md)。
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么？预期是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 执行 ……
        2. 看到……
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境信息
      placeholder: |
        OS: Windows 11 / macOS 15 / Ubuntu 24.04
        Node: v22.13.0
        运行方式: 本地 / GitHub Actions / 其他
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请粘贴关键报错；注意先删除 Cookie、令牌、个人邮箱等敏感内容
      render: shell
    validations:
      required: false
